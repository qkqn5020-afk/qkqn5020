<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>베카24 창업 - 24시 무인 야구 문화공간의 혁신</title>
    <!-- 새롭게 디자인된 브랜드 심볼 파비콘: 야구공의 실밥과 'B'를 형상화한 미니멀 디자인 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231e40af'/%3E%3Ccircle cx='50' cy='50' r='35' fill='white'/%3E%3Cpath d='M30 35C40 45 40 55 30 65M70 35C60 45 60 55 70 65' fill='none' stroke='%23ef4444' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M45 40V60M45 40H52C55 40 57 42 57 45C57 48 55 50 52 50H45M45 50H53C56 50 58 52 58 55C58 58 56 60 53 60H45' fill='none' stroke='%231e40af' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
            background-color: #ffffff;
        }
        .text-primary { color: #1e40af; }
        .bg-primary { background-color: #1e40af; }
        .border-primary { border-color: #1e40af; }
        .text-accent { color: #f97316; }
        .bg-accent { background-color: #f97316; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #1e40af; border-radius: 4px; }

        @keyframes marquee {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }
        .animate-marquee {
          display: flex;
          width: max-content;
          animation: marquee 30s linear infinite;
        }
        .animate-slow-marquee {
          display: flex;
          width: max-content;
          animation: marquee 50s linear infinite;
        }

        @keyframes fadeInUp {
          from {
            opacity: 0;
            transform: translateY(30px) scale(0.98);
          }
          to {
            opacity: 1;
            transform: translateY(0) scale(1);
          }
        }
        .animate-fade-in-up {
          animation: fadeInUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Premium Text Reveal Effect */
        .reveal-text {
          opacity: 0;
          transform: translateY(40px) scale(0.95) perspective(1000px) translateZ(-50px);
          transition: all 1.2s cubic-bezier(0.165, 0.84, 0.44, 1);
          will-change: transform, opacity;
        }
        .reveal-text.active {
          opacity: 1;
          transform: translateY(0) scale(1) perspective(1000px) translateZ(0);
        }

        /* ARM Cutout Enhanced Visuals */
        .arm-cutout-shadow {
          filter: drop-shadow(0 25px 35px rgba(0, 0, 0, 0.25));
          transition: transform 0.3s ease-out;
        }
        
        /* LED Motion Continuity Light Streaks */
        @keyframes motionLine {
          0% { transform: scaleX(0); opacity: 0; transform-origin: left; }
          50% { opacity: 0.8; }
          100% { transform: scaleX(1); opacity: 0; transform-origin: right; }
        }
        .motion-line {
          position: absolute;
          height: 2px;
          background: linear-gradient(90deg, transparent, #3b82f6, transparent);
          animation: motionLine 3s infinite;
          pointer-events: none;
        }

        .parallax-element {
          will-change: transform;
          transition: transform 0.1s linear;
        }

        @keyframes armRotation {
          0% { transform: rotate(-1.5deg) translateY(0); }
          50% { transform: rotate(1.5deg) translateY(-5px); }
          100% { transform: rotate(-1.5deg) translateY(0); }
        }
        .animate-arm-premium {
          animation: armRotation 8s ease-in-out infinite;
        }

        .patent-grid-item {
          transition: all 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
          filter: grayscale(1) brightness(0.9);
          opacity: 0.6;
          transform: translateY(20px);
        }
        .patent-grid-item.active {
          transform: translateY(0);
          opacity: 0.8;
        }
        .patent-grid-item:hover {
          filter: grayscale(0) brightness(1);
          opacity: 1;
          transform: scale(1.08) translateY(-10px) rotate(1deg);
          box-shadow: 0 30px 60px -12px rgba(0,0,0,0.25);
          z-index: 10;
        }
    </style>
<script type="importmap">
{
